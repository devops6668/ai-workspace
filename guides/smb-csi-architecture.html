<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMB CSI Driver Operator - Architecture</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #020617; font-family: 'JetBrains Mono', monospace; display: flex; justify-content: center; padding: 40px 20px; }
  svg text { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<svg viewBox="0 0 960 720" width="960" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <!-- Arrowhead markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="#020617"/>
  <rect width="960" height="720" fill="url(#grid)"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">SMB CSI Driver Operator — OCP Architecture</text>
  <text x="480" y="54" text-anchor="middle" fill="#64748b" font-size="9">OpenShift Container Platform · standalone only</text>

  <!-- ====== Arrows (drawn first, behind boxes) ====== -->

  <!-- App Pod → PVC -->
  <line x1="190" y1="170" x2="190" y2="218" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="200" y="197" fill="#22d3ee" font-size="7">mount</text>

  <!-- PVC → StorageClass -->
  <line x1="270" y1="242" x2="370" y2="242" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- StorageClass → Provisioner (dynamic) -->
  <line x1="500" y1="270" x2="500" y2="318" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="510" y="298" fill="#34d399" font-size="7">provision</text>

  <!-- Provisioner → Secret -->
  <line x1="440" y1="345" x2="310" y2="345" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-rose)"/>
  <text x="350" y="338" fill="#fb7185" font-size="7">auth</text>

  <!-- Provisioner → SMB Server -->
  <line x1="620" y1="345" x2="730" y2="345" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="655" y="338" fill="#fbbf24" font-size="7">create share</text>

  <!-- Controller Deployment → Node DaemonSet -->
  <line x1="500" y1="395" x2="500" y2="465" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="510" y="432" fill="#a78bfa" font-size="7">CSI protocol</text>

  <!-- Node DaemonSet → App Pod -->
  <line x1="380" y1="490" x2="190" y2="490" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="190" y1="490" x2="190" y2="180" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="240" y="483" fill="#22d3ee" font-size="7">mount volume</text>

  <!-- Node DaemonSet → Secret -->
  <line x1="440" y1="500" x2="310" y2="500" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-rose)"/>

  <!-- Node DaemonSet → SMB Server -->
  <line x1="620" y1="500" x2="730" y2="500" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="650" y="493" fill="#fbbf24" font-size="7">CIFS mount</text>

  <!-- Operator → ClusterCSIDriver -->
  <line x1="500" y1="130" x2="500" y2="80" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <text x="510" y="108" fill="#94a3b8" font-size="7">watches</text>

  <!-- ====== Boxes ====== -->

  <!-- ClusterCSIDriver CR -->
  <rect x="370" y="62" width="260" height="26" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="370" y="62" width="260" height="26" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="79" text-anchor="middle" fill="#94a3b8" font-size="9">ClusterCSIDriver: smb.csi.k8s.io</text>

  <!-- Operator (SMB) -->
  <rect x="370" y="100" width="260" height="36" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="370" y="100" width="260" height="36" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="115" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="600">smb-csi-driver-operator</text>
  <text x="500" y="128" text-anchor="middle" fill="#64748b" font-size="7">OLM managed · openshift-cluster-csi-drivers</text>

  <!-- Application Pod -->
  <rect x="80" y="140" width="220" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="190" y="160" text-anchor="middle" fill="#22d3ee" font-size="10" font-weight="600">Application Pod</text>
  <text x="190" y="174" text-anchor="middle" fill="#67e8f9" font-size="7">Deployment · uses PVC</text>

  <!-- PVC -->
  <rect x="80" y="218" width="220" height="34" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="190" y="240" text-anchor="middle" fill="#22d3ee" font-size="9" font-weight="600">PersistentVolumeClaim</text>

  <!-- StorageClass -->
  <rect x="370" y="222" width="260" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="240" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">StorageClass: smb</text>
  <text x="500" y="253" text-anchor="middle" fill="#6ee7b7" font-size="7">provisioner: smb.csi.k8s.io</text>
  <text x="500" y="264" text-anchor="middle" fill="#6ee7b7" font-size="7">source: //server/share</text>

  <!-- Secret -->
  <rect x="160" y="318" width="200" height="54" rx="6" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="260" y="337" text-anchor="middle" fill="#fb7185" font-size="10" font-weight="600">Secret: smbcreds</text>
  <text x="260" y="350" text-anchor="middle" fill="#fda4af" font-size="7">username + password</text>
  <text x="260" y="361" text-anchor="middle" fill="#fda4af" font-size="7">provisioner + node-stage</text>

  <!-- Controller Deployment -->
  <rect x="370" y="318" width="260" height="70" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="500" y="336" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">Controller Deployment</text>
  <text x="500" y="349" text-anchor="middle" fill="#6ee7b7" font-size="7">csi-provisioner</text>
  <text x="500" y="360" text-anchor="middle" fill="#6ee7b7" font-size="7">csi-resizer · liveness-probe</text>
  <text x="500" y="371" text-anchor="middle" fill="#6ee7b7" font-size="7">kube-rbac-proxy (metrics)</text>
  <text x="500" y="382" text-anchor="middle" fill="#6ee7b7" font-size="7">smb-driver-controller</text>

  <!-- SMB Server (external) -->
  <rect x="730" y="318" width="180" height="54" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="820" y="337" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">SMB Server</text>
  <text x="820" y="350" text-anchor="middle" fill="#fcd34d" font-size="7">Samba / Windows</text>
  <text x="820" y="361" text-anchor="middle" fill="#fcd34d" font-size="7">CIFS/SMB share</text>

  <!-- Node DaemonSet -->
  <rect x="370" y="462" width="260" height="62" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="500" y="480" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Node DaemonSet</text>
  <text x="500" y="493" text-anchor="middle" fill="#c4b5fd" font-size="7">smb-driver · node-driver-registrar</text>
  <text x="500" y="504" text-anchor="middle" fill="#c4b5fd" font-size="7">liveness-probe · host network</text>
  <text x="500" y="515" text-anchor="middle" fill="#c4b5fd" font-size="7">one pod per node · mounts SMB</text>

  <!-- Second SMB Server mount -->
  <rect x="730" y="472" width="180" height="44" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="820" y="490" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">SMB Share</text>
  <text x="820" y="502" text-anchor="middle" fill="#fcd34d" font-size="7">CIFS mount at node level</text>

  <!-- ====== Namespace boundary ====== -->
  <rect x="355" y="145" width="290" height="400" rx="8" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="365" y="160" fill="#475569" font-size="8">openshift-cluster-csi-drivers namespace</text>

  <!-- ====== Legend ====== -->
  <rect x="30" y="600" width="900" height="100" rx="6" fill="rgba(15,23,42,0.7)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="620" fill="#94a3b8" font-size="9" font-weight="600">Legend</text>

  <!-- Row 1 -->
  <line x1="50" y1="640" x2="90" y2="640" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="98" y="643" fill="#22d3ee" font-size="7">Application flow (mount, PVC)</text>

  <line x1="280" y1="640" x2="320" y2="640" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="328" y="643" fill="#34d399" font-size="7">CSI provisioner (dynamic)</text>

  <line x1="500" y1="640" x2="540" y2="640" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="548" y="643" fill="#fbbf24" font-size="7">SMB protocol (CIFS)</text>

  <line x1="700" y1="640" x2="740" y2="640" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-rose)"/>
  <text x="748" y="643" fill="#fb7185" font-size="7">Secret auth</text>

  <!-- Row 2 -->
  <line x1="50" y1="665" x2="90" y2="665" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="98" y="668" fill="#a78bfa" font-size="7">CSI gRPC protocol</text>

  <line x1="280" y1="665" x2="320" y2="665" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-slate)"/>
  <text x="328" y="668" fill="#94a3b8" font-size="7">Operator watches / reconciles</text>

  <rect x="500" y="657" width="12" height="12" rx="2" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="520" y="668" fill="#475569" font-size="7">Namespace boundary</text>

  <!-- Source -->
  <text x="940" y="695" text-anchor="end" fill="#475569" font-size="7">github.com/openshift/csi-operator</text>
</svg>
</body>
</html>
