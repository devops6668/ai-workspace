apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: basic
  namespace: istio-system
spec:
  updateStrategy:
    type: RevisionBased
  version: v1.24.3
  values:
    meshConfig:
      discoverySelectors:
        - matchLabels:
            service-mesh: enabled
      ingressControllerMode: "OFF"
      enablePrometheusMerge: true
      enableTracing: true
      dnsRefreshRate: 300s
      defaultConfig:
        proxyMetadata:
          ISTIO_META_DNS_AUTO_ALLOCATE: "true"
          ISTIO_META_DNS_CAPTURE: "true"
        terminationDrainDuration: 60s
      extensionProviders:
        - name: prometheus
          prometheus: {}
      enableAutoMtls: true
      tlsDefaults:
        minProtocolVersion: TLSV1_2
        cipherSuites:
          - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
          - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
          - TLS_RSA_WITH_AES_128_GCM_SHA256
          - TLS_RSA_WITH_AES_256_GCM_SHA384
    global:
      proxy:
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 10Mi
        autoInject: disabled
        logLevel: warning
      logging:
        level: warn
      defaultNodeSelector:
        node-role.kubernetes.io/infra: ''
      defaultTolerations:
        - effect: NoExecute
          key: node-role.kubernetes.io/infra
          operator: Equal
          value: reserved
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Equal
          value: reserved
    pilot:
      autoscaleEnabled: true
      autoscaleMin: 2
      replicaCount: 2
      traceSampling: 100
      nodeSelector:
        node-role.kubernetes.io/infra: ''
      tolerations:
        - effect: NoExecute
          key: node-role.kubernetes.io/infra
          operator: Equal
          value: reserved
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Equal
          value: reserved
