apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: istio-system
spec:
  version: default
  istio_namespace: istio-system
  deployment:
    accessible_namespaces:
    - '**'
    namespace: istio-system
  server:
    web_root: /
  external_services:
    prometheus:
      url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    tracing:
      enabled: true
      provider: tempo
      url: http://tempo-query-frontend.openshift-tempo.svc.cluster.local:3200
    grafana:
      enabled: false
