# ConfigMap: 要 keepalive 的 endpoints
#
# 格式: 每行一個 endpoint, 用空格分隔
#   <protocol> <host_or_ip> <port>
#
# protocol 支援: telnet, curl, curl-https, openssl
#   telnet        → nc -zvw3 <host> <port>
#   curl          → curl -sfk --max-time 5 http://<host>:<port>/
#   curl-https    → curl -sfk --max-time 5 https://<host>:<port>/
#   openssl       → echo | openssl s_client -connect <host>:<port> 2>/dev/null | grep -q "Verify return code: 0"
#
# 範例:
#   telnet 10.0.0.1 22
#   curl 10.0.0.1 80
#   curl-https api.example.com 443
#   openssl mail.example.com 465
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: firewall-keepalive-endpoints
  namespace: default
data:
  endpoints.txt: |
    telnet 10.0.0.1 22
    curl 10.0.0.1 80
    curl-https api.example.com 443
    openssl mail.example.com 465
