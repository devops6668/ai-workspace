apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-route
  namespace: litellm
spec:
  parentRefs:
    - name: litellm-gateway
  hostnames:
    - "litellm.luban.paulhome.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: litellm
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /ui
      backendRefs:
        - name: litellm
          port: 4000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: litellm
          port: 4000
  # Optional: redirect HTTP to HTTPS
  # rules:
  #   - matches:
  #       - path:
  #           type: PathPrefix
  #           value: /
  #     filters:
  #       - type: RequestRedirect
  #         requestRedirect:
  #           hostname: litellm.luban.paulhome.local
  #           scheme: https
  #           port: 443
