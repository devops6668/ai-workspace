# LiteLLM service (if not auto-created by the Helm chart)
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm  # adjust to match your deployment's pod selector
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000
