# =============================================================================
# LiteLLM Proxy Configuration (jupyter-ai v3.x)
# =============================================================================
# This file can be mounted via K8s ConfigMap
# Environment variables can be interpolated: ${VAR_NAME}
#
# Note: jupyter-ai v3.x uses LiteLLM directly via jupyter-ai-litellm package.
# This config is for standalone LiteLLM Proxy deployment (optional).
# =============================================================================

model_list:
  # ===========================================================================
  # Agnes AI (OpenAI-compatible)
  # ===========================================================================
  - model_name: agnes-2.0-flash
    litellm_params:
      model: openai/agnes-2.0-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: ${OPENAI_API_KEY}

  - model_name: agnes-2.5-flash
    litellm_params:
      model: openai/agnes-2.5-flash
      api_base: https://apihub.agnes-ai.com/v1
      api_key: ${OPENAI_API_KEY}

  - model_name: agnes-2.5-pro
    litellm_params:
      model: openai/agnes-2.5-pro
      api_base: https://apihub.agnes-ai.com/v1
      api_key: ${OPENAI_API_KEY}

  # ===========================================================================
  # OpenAI Models
  # ===========================================================================
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: ${OPENAI_API_KEY}

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: ${OPENAI_API_KEY}

  # ===========================================================================
  # Anthropic Models
  # ===========================================================================
  - model_name: claude-3-opus
    litellm_params:
      model: anthropic/claude-3-opus-20240229
      api_key: ${ANTHROPIC_API_KEY}

  - model_name: claude-3-sonnet
    litellm_params:
      model: anthropic/claude-3-sonnet-20240229
      api_key: ${ANTHROPIC_API_KEY}

  - model_name: claude-3-haiku
    litellm_params:
      model: anthropic/claude-3-haiku-20240307
      api_key: ${ANTHROPIC_API_KEY}

  # ===========================================================================
  # Ollama Models (Local)
  # ===========================================================================
  # - model_name: llama3
  #   litellm_params:
  #     model: ollama/llama3
  #     api_base: http://ollama:11434

  # ===========================================================================
  # Custom Models (via OpenAI-compatible API)
  # ===========================================================================
  # - model_name: custom-model
  #   litellm_params:
  #     model: openai/my-custom-model
  #     api_base: http://custom-api:8000/v1
  #     api_key: ${CUSTOM_API_KEY}

# =============================================================================
# General Settings
# =============================================================================
general_settings:
  master_key: ${LITELLM_MASTER_KEY:-sk-change-me-in-production}
  drop_params: true  # Drop unsupported params instead of erroring

# =============================================================================
# LiteLLM Settings
# =============================================================================
litellm_settings:
  set_verbose: false
  # success_callback: ["langfuse"]  # Optional: Enable Langfuse for cost tracking

# =============================================================================
# jupyter-ai v3.x Integration Note
# =============================================================================
# For jupyter-ai v3.x, the Jupyternaut persona uses LiteLLM directly
# via the jupyter-ai-litellm package. No separate proxy needed.
#
# The model is configured in JupyterLab Settings > AI Settings:
#   - Chat Model: openai/agnes-2.0-flash
#   - API Base: https://apihub.agnes-ai.com/v1 (via OPENAI_API_BASE env var)
#   - API Key: via OPENAI_API_BASE env var
#
# This standalone proxy config is only needed if you want to:
#   1. Centralize API key management
#   2. Add rate limiting / budget controls
#   3. Use load balancing across multiple providers
# =============================================================================
